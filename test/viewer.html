<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Arena Beasts - model viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #20263a; overflow: hidden; font: 12px "Trebuchet MS", sans-serif; color: #e8ecff; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #info { position: fixed; left: 8px; top: 6px; text-shadow: 0 1px 2px #000; }
</style>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<!-- Development tool. Shows one creature from 3 sides.
     Options: ?id=kilnox  &pose=idle|move|wind|strike|hurt|cycle  &yaw=0 (extra turn, degrees)  &zoom=1  &still=1  &one=1 (one large view)  &pitch=18 -->
<canvas id="c"></canvas>
<div id="info"></div>
<script type="module">
import { THREE, makeRenderer, setEnv, lightRig, makeComposer } from '../js/gfx/stage.js';
import { Creature, newPose, blueprint, register } from '../js/gfx/rig.js';

const q = new URLSearchParams(location.search), id = q.get('id') || 'kilnox', poseName = q.get('pose') || 'idle';
const yaw0 = +(q.get('yaw') || 0), zoom = +(q.get('zoom') || 1), still = q.get('still'), one = q.get('one'), pitch = +(q.get('pitch') || 24);
const cv = document.getElementById('c'), renderer = makeRenderer(cv);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#2a3350');
setEnv(renderer, scene);
const L = lightRig(scene, { area: 6 });
const ground = new THREE.Mesh(new THREE.CircleGeometry(12, 48), new THREE.MeshStandardMaterial({ color: '#59607c', roughness: 0.9 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const cam = new THREE.PerspectiveCamera(24, 1, 0.1, 100);

register((await import('../js/gfx/models/' + id + '.js')).default);
const t0 = performance.now();
let bp;
try { bp = blueprint(id); } catch (e) { document.getElementById('info').textContent = 'ERROR: ' + e.message; throw e; }
const ms = performance.now() - t0;
const gap = +(q.get('gap') || 2.5), yaws = one ? [-50] : [-50, 0, 130], list = [];
yaws.forEach((y, i) => {
  const c = new Creature(id);
  c.root.position.x = one ? 0 : (i - 1) * gap;
  c.root.rotation.y = (y + yaw0) * Math.PI / 180;
  scene.add(c.root); list.push(c);
});
document.getElementById('info').textContent = id + ' · ' + bp.verts + ' vertices · ' + bp.tris + ' triangles · build ' + ms.toFixed(0) + ' ms';

let comp;
function resize() {
  const w = innerWidth, h = innerHeight, d = Math.min(2, devicePixelRatio || 1);
  renderer.setPixelRatio(d); renderer.setSize(w, h, false);
  cam.aspect = w / h; cam.updateProjectionMatrix();
  comp = makeComposer(renderer, scene, cam).comp;
}
addEventListener('resize', resize); resize();

const pose = newPose();
function setPose(tm) {
  const ph = tm % 6;
  let name = poseName;
  if (name === 'cycle') name = ph < 1.5 ? 'idle' : ph < 3.2 ? 'move' : ph < 4 ? 'wind' : ph < 4.5 ? 'strike' : ph < 5 ? 'hurt' : 'idle';
  const tg = { mv: 0, a: 0, s: 0, h: 0, sw: 0 };
  if (name === 'move') { tg.mv = 1; tg.sw = 0.7; } else if (name === 'wind') tg.a = 1; else if (name === 'strike') tg.s = 1; else if (name === 'hurt') tg.h = 1;
  const k = poseName === 'cycle' ? 0.2 : 1;
  for (const key in tg) pose[key] += (tg[key] - pose[key]) * k;
  pose.tm = tm; pose.p = tm * 2.6; pose.w = tm * 9; pose.o = tm * 1.3;
  pose.bl = (tm % 3) > 2.88 ? 1 : 0;
  pose.gl = q.get('glow') ? 1 : 0; pose.k = q.get('k') || 'melee';
}
function frame(msNow) {
  const tm = still ? +(q.get('t') || 0.4) : msNow / 1000;
  setPose(tm);
  for (const c of list) c.update(pose);
  const d = (one ? 6.2 : 12.5) / zoom, pr = pitch * Math.PI / 180;
  cam.position.set(0, 0.75 + Math.sin(pr) * d, Math.cos(pr) * d); cam.lookAt(0, 0.72, 0);
  comp.render();
  if (!still) requestAnimationFrame(frame);
}
window.viewerFrame = frame;
requestAnimationFrame(frame);
</script>
</body>
</html>
