<body>
<canvas id="gl"></canvas>
<canvas id="cv"></canvas>
<div id="loading"><h1>Arena <span>Beasts</span></h1><div class="lbar"><i id="loadbar"></i></div><p id="loadtxt">Loading the 3D engine…</p></div>

<div id="menu" class="screen">
  <header>
    <h1>Arena <span>Beasts</span></h1>
    <div id="online" aria-label="Online play">
      <b>Play online</b>
      <input id="pname" maxlength="12" placeholder="Your name" aria-label="Your name" autocomplete="off">
      <button id="create">Create room</button>
      <span id="linkbox" class="hidden"><input id="link" readonly aria-label="Room link"><button id="copy">Copy link</button></span>
      <span id="nstatus"></span>
      <button id="leave" class="hidden">Leave room</button>
    </div>
    <details id="help">
      <summary>Controls</summary>
      <div>
        <p id="khint"></p>
        <div id="keys"></div>
        <div class="kfoot"><span><kbd>Mouse</kbd> Aim</span><button id="kreset" type="button">Reset to defaults</button></div>
      </div>
    </details>
  </header>
  <main>
    <section id="grid" aria-label="Creatures"></section>
    <section id="stage" aria-label="Selected creature">
      <div id="smark"></div>
      <canvas id="stagecv"></canvas>
      <div id="shead"><h2 id="sname"></h2><p id="sepi"></p><div id="stypes"></div><p id="srole"></p></div>
      <button id="sbtn" type="button" class="hidden">Story</button>
      <div id="story" class="hidden" aria-label="Story of the creature"></div>
      <div id="sfoot"><div id="sstats"></div><p id="sblurb"></p></div>
    </section>
    <aside id="detail" aria-label="Creature details"></aside>
  </main>
  <footer>
    <div id="teamwrap"><span id="tcount">Your team 0 / 6</span><div id="team" aria-label="Your team"></div></div>
    <div id="opts">
      <div id="diff" role="group" aria-label="Difficulty">
        <button data-d="easy">Easy</button><button data-d="normal" class="on">Normal</button><button data-d="hard">Hard</button>
      </div>
      <button id="random">Random team</button>
      <button id="clear">Clear</button>
      <button id="start" class="primary" disabled>Select 6 more</button>
    </div>
  </footer>
</div>

<div id="result" class="screen hidden"></div>
<div id="netmsg" class="hidden" role="status"><span id="nmtext"></span><button id="nmbtn"></button></div>
